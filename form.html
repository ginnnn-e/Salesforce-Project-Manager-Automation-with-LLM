<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Case: Global Licensing | Salesforce</title>
    
    <style>
        /* SALESFORCE LIGHTNING DESIGN SYSTEM SIMULATION */
        :root {
            --sf-blue: #0176d3;
            --sf-bg: #b0c4df;
            --sf-header-bg: #f3f3f3;
            --sf-border: #dddbda;
            --sf-text-main: #080707;
            --sf-text-light: #3e3e3c;
            --sf-input-border: #747474;
            --sf-focus: #0176d3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--sf-bg);
            background-image: url('https://www.salesforce.com/content/dam/web/en_us/www/images/home/bg-blue-texture.jpg');
            background-size: cover;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* --- MAIN FORM MODAL --- */
        .sf-modal {
            background: #fff;
            width: 100%;
            max-width: 900px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .sf-modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--sf-border);
            background: #f3f3f3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* --- PROGRESS BAR CSS --- */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #e0e0e0;
            display: none; /* Hidden by default */
        }

        .progress-bar {
            height: 100%;
            background-color: var(--sf-blue);
            width: 0%;
            transition: width 0.3s ease-in-out;
        }

        .sf-modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 300;
            color: var(--sf-text-main);
        }

        .sf-modal-content {
            padding: 1rem 0;
            background: #fff;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sf-section-header {
            background-color: #f3f3f3;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--sf-text-light);
            margin-bottom: 1rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between; 
        }

        .sf-section-header-left {
            display: flex;
            align-items: center;
        }
        
        .sf-section-header-left::before {
            content: '▼';
            font-size: 0.6rem;
            margin-right: 8px;
            color: var(--sf-text-light);
            display: inline-block;
        }
        
        .sf-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 2rem;
            row-gap: 1rem;
            padding: 0 2rem;
        }

        /* Dynamic Row Styling */
        .product-row {
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 1rem;
            margin: 0 2rem 1rem 2rem;
            position: relative;
            background-color: #fcfcfc;
        }

        .product-row:hover {
            border-color: #b0c4df;
        }

        .product-row-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #0176d3;
        }

        .remove-row-btn {
            color: #ea001e;
            cursor: pointer;
            font-size: 0.8rem;
            background: none;
            border: none;
            text-decoration: underline;
        }

        .add-row-container {
            padding: 0 2rem;
            margin-bottom: 1.5rem;
        }

        .sf-field {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid transparent;
        }

        .sf-field label {
            font-size: 0.75rem;
            color: #3e3e3c;
            margin-bottom: 4px;
        }

        .sf-field label span.required {
            color: #ea001e;
        }

        .sf-input {
            border: 1px solid #dddbda;
            border-radius: 4px;
            padding: 0 12px;
            height: 32px;
            line-height: 32px;
            font-size: 0.8125rem;
            color: #080707;
            transition: all 0.1s;
            width: 100%;
            box-sizing: border-box;
        }

        .sf-input:focus {
            outline: 0;
            border-color: var(--sf-blue);
            box-shadow: 0 0 3px #0176d3;
        }
        
        textarea.sf-input {
            height: auto;
            line-height: 1.4;
            padding: 8px 12px;
            resize: vertical;
        }

        /* NEW: DISTINCT STYLING FOR THE PASTE EMAIL BOX */
        #aiInputText {
            background-color: #f0f8ff; /* AliceBlue background for distinction */
            border: 2px dashed #8bbee8; /* Dashed border to indicate 'drop zone' */
            font-family: 'Courier New', Courier, monospace; /* Monospace for 'raw text' feel */
            color: #333;
            font-size: 0.85rem;
            min-height: 120px; /* Ensure it is tall */
        }
        
        #aiInputText:focus {
            background-color: #fff;
            border-style: solid;
            border-color: var(--sf-blue);
        }
        
        #aiInputText::placeholder {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #747474;
            opacity: 0.8;
        }

        select.sf-input {
            background-color: #fff;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'%3E%3Cpath fill='%23706e6b' d='M3 6l5 5 5-5z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
        }

        .sf-output-field {
            border-bottom: 1px solid #dddbda;
            padding: 4px 0;
            min-height: 20px;
            font-size: 0.875rem;
            color: #080707;
        }

        .sf-modal-footer {
            padding: 0.75rem 1rem;
            background-color: #f3f3f3;
            border-top: 1px solid var(--sf-border);
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .sf-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            height: 32px;
            font-size: 0.8125rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 400;
            white-space: nowrap;
        }

        .sf-btn-neutral {
            background: #fff;
            border: 1px solid #dddbda;
            color: #0176d3;
        }
        
        .sf-btn-neutral:hover { background-color: #f3f3f3; }

        .sf-btn-brand {
            background: #0176d3;
            border: 1px solid #0176d3;
            color: #fff;
            box-shadow: 0 1px 1px 0 rgba(0,0,0,0.16);
        }
        
        .sf-btn-brand:hover { background-color: #005fb2; }
        .sf-btn-brand:disabled { background-color: #c9c7c5; border-color: #c9c7c5; cursor: not-allowed; }

        .icon-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            background-color: #f2cf5b;
            border-radius: 4px;
            margin-right: 10px;
        }
        .icon-box i { color: #fff; font-size: 1.2rem; }

        /* --- LOADING SPINNER CSS --- */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        .spinner-dark {
            border: 2px solid rgba(1, 118, 211, 0.3);
            border-top: 2px solid #0176d3;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- SUCCESS POPUP OVERLAY --- */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: white;
            width: 550px;
            max-height: 95vh;
            overflow-y: auto;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .popup-header {
            background-color: #04844b;
            color: white;
            padding: 1rem;
        }

        .popup-header i { font-size: 2rem; }

        .popup-body {
            padding: 1.5rem;
            text-align: left;
        }

        .popup-body h3 {
            margin-top: 0;
            color: #080707;
            font-weight: 300;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .popup-data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #f3f3f3;
            padding-bottom: 0.25rem;
        }
        
        .popup-label { color: #706e6b; font-size: 0.85rem; font-weight: 600; }
        .popup-value { font-weight: 400; color: #080707; font-size: 0.9rem; text-align: right; max-width: 60%; }

        /* Scrollable area for list of products in popup */
        .popup-products-list {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 1rem;
            border: 1px solid #f3f3f3;
            padding: 0.5rem;
            background: #fafafa;
        }
        
        .popup-footer {
            background-color: #f3f3f3;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .popup-email-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }
        
        .popup-email-box textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #dddbda;
            background-color: #f9f9f9;
            color: #333;
            font-family: monospace;
            font-size: 0.8rem;
            border-radius: 4px;
            resize: vertical;
        }

        #popup-price {
            color: #04844b;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* AI Section Styles */
        .ai-input-container {
            padding: 0 2rem;
            margin-bottom: 1rem;
        }
        
        .ai-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }
        
        .sparkle-icon {
            color: #0176d3;
            margin-right: 5px;
        }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="sf-modal">
        <div class="sf-modal-header">
            <div style="display: flex; align-items: center;">
                <div class="icon-box"><i class="fas fa-suitcase"></i></div>
                <h2 id="modal-title">New Case: Export Licensing</h2>
            </div>
            
            <div id="progressContainer" class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <form id="salesforceForm">
            <div class="sf-modal-content">
                
                <div class="sf-section-header">
                    <div class="sf-section-header-left">AI Quick Import</div>
                </div>
                
                <div class="ai-input-container">
                    <div class="sf-field">
                        <label>Paste Email Request Here</label>
                        <textarea id="aiInputText" class="sf-input" rows="6" placeholder="Paste email content here (e.g. 'I need a quote for a Model X-500 going to Germany...')..."></textarea>
                    </div>
                    <div class="ai-toolbar">
                        <button type="button" id="aiExtractBtn" class="sf-btn sf-btn-neutral">
                            <i class="fas fa-magic sparkle-icon"></i> Auto-Fill Form
                        </button>
                    </div>
                </div>


                <div class="sf-section-header">
                    <div class="sf-section-header-left">Case Information</div>
                </div>
                
                <div class="sf-form-grid">
                    <div class="sf-field">
                        <label>Contact Name <span class="required">*</span></label>
                        <input type="text" class="sf-input" name="customerName" placeholder="Search Contacts..." required>
                    </div>

                    <div class="sf-field">
                        <label>Company <span class="required">*</span></label>
                        <input type="text" class="sf-input" name="company" placeholder="Search Company..." required>
                    </div>

                    <div class="sf-field">
                        <label>Contact Email <span class="required">*</span></label>
                        <input type="email" class="sf-input" name="email" placeholder="user@example.com" required>
                    </div>

                    <div class="sf-field">
                        <label>Priority</label>
                        <select class="sf-input">
                            <option>Medium</option>
                            <option>High</option>
                        </select>
                    </div>
                </div>

                <div class="sf-section-header">
                    <div class="sf-section-header-left">Product & Compliance Details</div>
                </div>

                <!-- Container for Dynamic Product Rows -->
                <div id="product-rows-container">
                    <!-- Initial Row will be inserted by JS or kept static below -->
                </div>

                <div class="add-row-container">
                     <button type="button" id="addRowBtn" class="sf-btn sf-btn-neutral">
                        <i class="fas fa-plus" style="margin-right:5px;"></i> Add Another Product
                    </button>
                </div>

                <div class="sf-section-header">
                    <div class="sf-section-header-left">Quotation System (Automated)</div>
                </div>

                <div class="sf-form-grid">
                    
                    <div class="sf-field">
                        <label>Calculated Cost (Total)</label>
                        <div id="res-price" class="sf-output-field" style="background:#f3f3f3;">[System Generated]</div>
                    </div>

                    <div class="sf-field">
                        <label>Official Quote (PDF)</label>
                        <div class="sf-output-field">
                            <a id="res-link" href="#" target="_blank" style="color:#0176d3; text-decoration:none; display:none;">Download Quote.pdf</a>
                        </div>
                    </div>
                </div>

            </div>

            <div class="sf-modal-footer">
                <button type="button" class="sf-btn sf-btn-neutral">Cancel</button>
                <button type="submit" id="submitBtn" class="sf-btn sf-btn-brand">Submit</button>
            </div>
        </form>
    </div>

    <div id="successPopup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-header">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="popup-body">
                <h3>Case Created Successfully!</h3>
                
                <div class="popup-data-row">
                    <span class="popup-label">Contact Name:</span>
                    <span class="popup-value" id="popup-name">--</span>
                </div>
                
                <div class="popup-label" style="margin-bottom:5px;">Products Licensed:</div>
                <div class="popup-products-list" id="popup-products-container">
                    <!-- Populated via JS -->
                </div>
                
                <hr style="border:0; border-top:1px dashed #ddd; margin: 15px 0;">

                <!-- Project Manager row removed -->
                
                <div class="popup-data-row">
                    <span class="popup-label">Total Cost:</span>
                    <span class="popup-value" id="popup-price">--</span>
                </div>

                <div class="popup-email-box">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="popup-label">Email Draft for Customer:</span>
                        <a href="#" onclick="copyEmail()" style="font-size:0.8rem; color:#0176d3; text-decoration:none;">
                            <i class="far fa-copy"></i> Copy
                        </a>
                    </div>
                    <textarea id="popup-email-text" readonly>Loading email draft...</textarea>
                </div>

            </div>
            <div class="popup-footer">
                <button onclick="closePopup()" class="sf-btn sf-btn-neutral">Close</button>
                <a id="popup-download-btn" href="#" target="_blank" class="sf-btn sf-btn-brand" style="text-decoration:none; display:none;">
                    <i class="fas fa-file-pdf" style="margin-right:5px;"></i> Download Invoice PDF
                </a>
            </div>
        </div>
    </div>

<script>
    const form = document.getElementById('salesforceForm');
    const submitBtn = document.getElementById('submitBtn');
    
    // AI Section Elements
    const aiExtractBtn = document.getElementById('aiExtractBtn');
    const aiInputText = document.getElementById('aiInputText');
    
    // Elements for Progress & Popup
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    
    const successPopup = document.getElementById('successPopup');
    const popupName = document.getElementById('popup-name');
    const popupProductsContainer = document.getElementById('popup-products-container');
    // popupPm removed
    const popupPrice = document.getElementById('popup-price');
    const popupDownloadBtn = document.getElementById('popup-download-btn');
    const popupEmailText = document.getElementById('popup-email-text');
    const mainResLink = document.getElementById('res-link');

    // Dynamic Rows
    const productRowsContainer = document.getElementById('product-rows-container');
    const addRowBtn = document.getElementById('addRowBtn');

    // !!! REPLACE THIS WITH YOUR WEBHOOK URL !!!
    const N8N_EXTRACT_WEBHOOK_URL = 'https://aipblueocean.app.n8n.cloud/webhook/d3b44853-8592-4d2c-b912-cc3b710e846d';
    const N8N_SUBMIT_WEBHOOK_URL = 'https://aipblueocean.app.n8n.cloud/webhook/bcceb884-2cf4-4c6d-921c-a1ce2e93a40d';
    // NEW: Webhook to fetch dropdown data on load
    const N8N_INIT_WEBHOOK_URL = 'https://aipblueocean.app.n8n.cloud/webhook/d3b44853-8592-4d2c-b912-cc3b710e846d';

    // CHANGED: Made this a let so it can be overwritten by webhook data
    let licenseData = {
        "USA": ["FCC Certification", "Safety Check"],
        "Germany": ["CE Marking", "Safety Check"],
        "Japan": ["VCCI", "Safety Check"],
        "Vietnam": ["CR Mark", "Safety Check"],
        "Singapore": ["Safety Mark", "IMDA Certification", "Type Approval Certificates"],
        "Australia": ["Safety Check", "Type Approval Certificates"],
        "Indonesia": ["CR Mark", "Type Approval Certificates"]
    };

    let progressInterval = null;

    // --- INITIALIZATION ---
    // Add the first product row by default
    addProductRow();
    
    // FETCH INIT DATA ON LOAD
    window.addEventListener('DOMContentLoaded', fetchInitData);

    async function fetchInitData() {
        try {
            console.log("Fetching init data...");
            const response = await fetch(N8N_INIT_WEBHOOK_URL);
            if (!response.ok) throw new Error("Init webhook failed");
            
            const rawData = await response.json();
            // Handle array or wrapped response
            let dataList = Array.isArray(rawData) ? rawData : (rawData.body || rawData.data || []);
            
            if (dataList.length > 0) {
                const newLicenseData = {};
                
                dataList.forEach(item => {
                    const country = item.Country;
                    const license = item.License_Type;
                    
                    if (country && license) {
                        if (!newLicenseData[country]) {
                            newLicenseData[country] = [];
                        }
                        if (!newLicenseData[country].includes(license)) {
                            newLicenseData[country].push(license);
                        }
                    }
                });
                
                // Update the global data
                licenseData = newLicenseData;
                console.log("Updated license data:", licenseData);
                
                // Refresh existing dropdowns in the DOM
                document.querySelectorAll('.country-select').forEach(select => {
                    const currentVal = select.value;
                    select.innerHTML = getCountryOptionsHTML(currentVal);
                });
            }
        } catch (err) {
            console.warn("Could not load initial data from webhook, using defaults.", err);
        }
    }

    addRowBtn.addEventListener('click', () => {
        addProductRow();
    });

    // Helper to generate options HTML string
    function getCountryOptionsHTML(selectedValue = "") {
        let options = '<option value="">--None--</option>';
        const countries = Object.keys(licenseData).sort();
        
        countries.forEach(country => {
            const isSelected = (country === selectedValue) ? 'selected' : '';
            options += `<option value="${country}" ${isSelected}>${country}</option>`;
        });
        
        return options;
    }

    function addProductRow(data = {}) {
        const index = document.querySelectorAll('.product-row').length + 1;
        const div = document.createElement('div');
        div.className = 'product-row';
        div.innerHTML = `
            <div class="product-row-header">
                <span>Product Record #${index}</span>
                ${index > 1 ? '<button type="button" class="remove-row-btn">Remove</button>' : ''}
            </div>
            <div class="sf-form-grid" style="padding:0; grid-template-columns: 1fr 1fr;">
                <div class="sf-field">
                    <label>Equipment Name</label> <!-- Optional: Removed * and required -->
                    <input type="text" class="sf-input product-equipment" placeholder="" value="${data.equipment || ''}">
                </div>

                <div class="sf-field">
                    <label>Model Number <span class="required">*</span></label>
                    <input type="text" class="sf-input product-model" required value="${data.model || ''}">
                </div>

                <div class="sf-field">
                    <label>Export Destination <span class="required">*</span></label>
                    <select class="sf-input country-select" required>
                        ${getCountryOptionsHTML(data.country)}
                    </select>
                </div>

                <div class="sf-field">
                    <label>License Type</label>
                    <select class="sf-input license-select" required disabled>
                        <option value="">--Select Country First--</option>
                    </select>
                </div>
            </div>
        `;

        productRowsContainer.appendChild(div);

        // Setup Event Listeners for this specific row
        const countrySelect = div.querySelector('.country-select');
        const licenseSelect = div.querySelector('.license-select');
        const removeBtn = div.querySelector('.remove-row-btn');

        if (removeBtn) {
            removeBtn.addEventListener('click', () => {
                div.remove();
                updateRowNumbers();
            });
        }

        countrySelect.addEventListener('change', () => updateLicenseDropdown(countrySelect, licenseSelect));

        // Pre-fill Country and License if data provided
        if (data.country) {
            // Find option case-insensitive
            for (let i = 0; i < countrySelect.options.length; i++) {
                if (countrySelect.options[i].value.toLowerCase() === data.country.toLowerCase()) {
                    countrySelect.selectedIndex = i;
                    break;
                }
            }
            updateLicenseDropdown(countrySelect, licenseSelect);

            if (data.license) {
                let matchFound = false;
                for (let i = 0; i < licenseSelect.options.length; i++) {
                    if (licenseSelect.options[i].value === data.license) {
                        licenseSelect.selectedIndex = i;
                        matchFound = true;
                        break;
                    }
                }
                
                // Requirement: if license not found, show error and default to first
                if (!matchFound && data.license) {
                    alert(`⚠️ License "${data.license}" not valid for ${countrySelect.value}. Defaulting to first available option.`);
                    if (licenseSelect.options.length > 1) {
                        licenseSelect.selectedIndex = 1; // 0 is placeholder
                    }
                } else if (!data.license) {
                     // If country known but license missing/empty in extraction
                     alert(`⚠️ No license specified for ${countrySelect.value}. Defaulting to first available option.`);
                     if (licenseSelect.options.length > 1) {
                        licenseSelect.selectedIndex = 1;
                    }
                }
            } else if (countrySelect.value && !data.license) {
                // Country selected but no license provided at all
                if (licenseSelect.options.length > 1) {
                    licenseSelect.selectedIndex = 1;
                }
            }
        }
    }

    function updateRowNumbers() {
        const headers = document.querySelectorAll('.product-row-header span');
        headers.forEach((span, i) => {
            span.textContent = `Product Record #${i + 1}`;
        });
    }

    function updateLicenseDropdown(countrySelect, licenseSelect) {
        const selectedCountry = countrySelect.value;
        licenseSelect.innerHTML = '';
        
        if (selectedCountry && licenseData[selectedCountry]) {
            licenseSelect.disabled = false;
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.textContent = "--None--";
            licenseSelect.appendChild(defaultOpt);

            licenseData[selectedCountry].forEach(license => {
                const option = document.createElement('option');
                option.value = license;
                option.textContent = license;
                licenseSelect.appendChild(option);
            });
        } else {
            licenseSelect.disabled = true;
            licenseSelect.innerHTML = '<option value="">--Select Country First--</option>';
        }
    }

    function closePopup() {
        successPopup.style.display = 'none';
        progressBar.style.width = '0%';
        progressContainer.style.display = 'none';
    }

    function copyEmail() {
        popupEmailText.select();
        popupEmailText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(popupEmailText.value).then(() => {
            alert("Email draft copied!");
        });
    }

    function simulateProgress() {
        progressContainer.style.display = 'block';
        let width = 0;
        progressBar.style.width = '0%';
        
        progressInterval = setInterval(() => {
            if (width >= 90) {
            } else {
                width += Math.random() * 10;
                if (width > 90) width = 90;
                progressBar.style.width = width + '%';
            }
        }, 300);
    }

    function finishProgress() {
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
    }

    // --- AI Extraction Logic ---
    aiExtractBtn.addEventListener('click', async () => {
        const textToExtract = aiInputText.value.trim();
        
        if (!textToExtract) {
            alert("Please paste text into the field first.");
            return;
        }

        const originalBtnText = aiExtractBtn.innerHTML;
        aiExtractBtn.innerHTML = '<div class="spinner spinner-dark"></div> Analyzing...';
        aiExtractBtn.disabled = true;

        try {
            const response = await fetch(N8N_EXTRACT_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'extract',
                    text: textToExtract
                })
            });

            const textResponse = await response.text();
            if (!textResponse) throw new Error("Empty response from extraction server.");
            
            const rootData = JSON.parse(textResponse);
            let itemsToProcess = [];
            
            // --- NEW: Handle logic for [ { "output": [ { "body": ... }, ... ] } ] ---
            if (Array.isArray(rootData) && rootData.length > 0 && rootData[0].output && Array.isArray(rootData[0].output)) {
                // Extract the 'body' from each item in the output array
                itemsToProcess = rootData[0].output.map(item => item.body || item);
            } 
            // --- Fallback logic for previous/legacy structures ---
            else {
                let flatData = rootData;
                if (Array.isArray(flatData) && flatData.length > 0) flatData = flatData[0];
                
                if (flatData.output && Array.isArray(flatData.output)) {
                     itemsToProcess = flatData.output.map(item => item.body || item);
                } else if (flatData.products && Array.isArray(flatData.products)) {
                     itemsToProcess = flatData.products;
                } else if (flatData.items && Array.isArray(flatData.items)) {
                     itemsToProcess = flatData.items;
                } else {
                     // Single flat object fallback
                     itemsToProcess = [flatData.body || flatData];
                }
            }

            console.log("Extracted Items:", itemsToProcess);
            
            if (itemsToProcess.length > 0) {
                // 1. Fill Global Fields (Contact, Company, etc.) from the FIRST record
                const firstRecord = itemsToProcess[0];
                
                if (firstRecord.contact_name) form.customerName.value = firstRecord.contact_name;
                if (firstRecord.company) form.company.value = firstRecord.company;
                
                // Handle different email key variations
                if (firstRecord.contact_email) form.email.value = firstRecord.contact_email;
                else if (firstRecord.email) form.email.value = firstRecord.email;
                
                // 2. Clear existing rows
                productRowsContainer.innerHTML = '';

                // 3. Create Product Rows for EVERY item found
                itemsToProcess.forEach(item => {
                    const rowData = {
                        equipment: item.equipment_name || item.equipment,
                        model: item.model_number || item.model,
                        country: item.export_destination || item.country,
                        license: item.license_type || item.license
                    };
                    addProductRow(rowData);
                });
            } else {
                // If the array was empty for some reason, just ensure one empty row exists
                productRowsContainer.innerHTML = '';
                addProductRow();
            }
            
            aiExtractBtn.innerHTML = '<i class="fas fa-check"></i> Filled!';
            setTimeout(() => {
                aiExtractBtn.innerHTML = originalBtnText;
                aiExtractBtn.disabled = false;
            }, 2000);

        } catch (error) {
            console.error('Extraction Error:', error);
            alert('Could not extract data: ' + error.message);
            aiExtractBtn.innerHTML = originalBtnText;
            aiExtractBtn.disabled = false;
        }
    });


    // --- Submit Logic ---
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.innerHTML = '<div class="spinner"></div> Processing...';
        submitBtn.disabled = true;
        simulateProgress();

        const contactName = form.customerName.value;
        const contactEmail = form.email.value;
        const companyName = form.company.value; // ADDED: Get company name
        
        const payload = [];
        const productRows = document.querySelectorAll('.product-row');
        
        productRows.forEach(row => {
            const country = row.querySelector('.country-select').value;
            const lic = row.querySelector('.license-select').value;

            payload.push({
                contact_name: contactName,
                contact_email: contactEmail,
                company: companyName, // ADDED: Include company in payload
                country: country,
                license_type: lic
            });
        });

        try {
            const response = await fetch(N8N_SUBMIT_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const textResponse = await response.text();
            if (!textResponse) throw new Error("Server returned empty response.");
            
            const resultData = JSON.parse(textResponse);
            
            if (!response.ok) throw new Error(`Server status: ${response.status}`);
            
            finishProgress();

            // --- REVISED PARSING LOGIC (Handles complex nested arrays) ---
            let resultItems = [];
            let metadataSource = {};

            // 1. Identify Root Object
            let rootObj = {};
            if (Array.isArray(resultData)) {
                rootObj = resultData[0]; // Take first item if array
            } else {
                rootObj = resultData;
            }

            // 2. Identify Item List (Crucial fix for dynamic rows)
            // Fix: Check for 'licenses' based on user reference first
            if (rootObj && Array.isArray(rootObj.licenses)) {
                resultItems = rootObj.licenses;
                metadataSource = rootObj;
            }
            // If the root object contains a 'data' array, use THAT as the list of products
            else if (rootObj && Array.isArray(rootObj.data)) {
                resultItems = rootObj.data;
                metadataSource = rootObj; // The wrapper contains metadata like url
            } 
            // Else try standard locations
            else if (rootObj && Array.isArray(rootObj.body)) {
                 resultItems = rootObj.body;
                 metadataSource = rootObj;
            } else if (Array.isArray(resultData)) {
                 resultItems = resultData; // The root array IS the list
                 metadataSource = resultData[0];
            } else {
                 resultItems = [resultData];
                 metadataSource = resultData;
            }
            
            // Normalize items (unwrap .body if present in items)
            resultItems = resultItems.map(item => {
                if (item && item.body && typeof item.body === 'object') {
                    return { ...item.body, _original: item };
                }
                return item;
            });
            
            // --- RESULT PARSING ---
            const currency = metadataSource['Currency'] || resultItems[0]?.Currency || '$';
            const emailDraft = metadataSource['Email'] || "Email text not found in response."; 
            
            // Handle Price Summation
            let finalPriceDisplay = 'Pending';
            let totalPrice = 0;
            let priceFound = false;

            // Check if root object has a total price
            if (metadataSource['total_price']) {
                finalPriceDisplay = metadataSource['total_price'];
            } 
            // Otherwise sum up items
            else if (resultItems.length > 0) {
                resultItems.forEach(item => {
                    // Try different price keys: 'price', 'Base_Price', 'cost'
                    const p = parseFloat(item.Base_Price || item.price || item.cost || 0);
                    if (!isNaN(p)) {
                        totalPrice += p;
                        priceFound = true;
                    }
                });
                if (priceFound) finalPriceDisplay = totalPrice.toFixed(2);
            }

            // Document URL - SUPER ROBUST CHECK
            // We search in multiple places: metadataSource, the root array/object, inside 'body', inside 'data', or the first item of the results.
            let pdfUrl = null;
            
            // Helper function to check an object for url-like keys
            const findUrl = (obj) => {
                if (!obj || typeof obj !== 'object') return null;
                return obj.url || obj.pdf_url || obj.invoice_url || obj.file_url || obj.link || obj.download_link;
            };

            // 1. Check metadata source (the wrapper or first item)
            pdfUrl = findUrl(metadataSource);

            // 2. Check if it's inside a 'body' property of metadataSource
            if (!pdfUrl && metadataSource.body) {
                pdfUrl = findUrl(metadataSource.body);
            }
            
            // 3. Check if it's inside a 'data' property
            if (!pdfUrl && metadataSource.data && !Array.isArray(metadataSource.data)) {
                 pdfUrl = findUrl(metadataSource.data);
            }

            // 4. Check the first item of the result list (often where row-specific data ends up)
            if (!pdfUrl && resultItems.length > 0) {
                pdfUrl = findUrl(resultItems[0]);
                // Check unwrapped original if it exists
                if (!pdfUrl && resultItems[0]._original) {
                    pdfUrl = findUrl(resultItems[0]._original);
                }
            }
            
            // 5. Hard fallback: Check rootData top level if it's an object
            if (!pdfUrl && !Array.isArray(resultData)) {
                pdfUrl = findUrl(resultData);
            }

            console.log("Extracted PDF URL:", pdfUrl);

            // --- UPDATE UI ---
            document.getElementById('res-price').innerText = finalPriceDisplay + " " + currency;
            
            // Update Main Form Link
            if (pdfUrl) {
                mainResLink.href = pdfUrl;
                mainResLink.style.display = 'inline'; // Make it visible
            } else {
                mainResLink.style.display = 'none';
            }

            // --- POPUP DATA POPULATION ---
            popupName.innerText = contactName;
            
            // Populate Popup Product List dynamically from RESPONSE DATA
            popupProductsContainer.innerHTML = '';
            
            resultItems.forEach((item, index) => {
                let itemPrice = "0.00";
                // Prioritize 'Base_Price' as per user reference
                const pVal = parseFloat(item.Base_Price || item.price || item.cost || 0);
                if (!isNaN(pVal)) itemPrice = pVal.toFixed(2);

                const itemCountry = item.Country || item.export_destination || item.country || "Unknown";
                const itemLicense = item.License_Type || item.license_type || item.license || "Standard License";
                const itemCurrency = item.Currency || currency;

                const pDiv = document.createElement('div');
                pDiv.className = 'popup-data-row';
                pDiv.style.borderBottom = '1px dashed #ddd';
                
                pDiv.innerHTML = `
                    <div style="text-align:left;">
                        <div style="font-size:0.8rem; color:#555;">Record #${index + 1} (${itemCountry})</div>
                        <div style="font-size:0.85rem; font-weight:bold;">${itemLicense}</div>
                    </div>
                    <div style="font-size:0.9rem; font-weight:bold; color:#04844b;">
                        ${itemPrice} ${itemCurrency}
                    </div>
                `;
                popupProductsContainer.appendChild(pDiv);
            });
            
            popupPrice.innerText = finalPriceDisplay + " " + currency;
            popupEmailText.value = emailDraft;

            // Update Popup Download Button
            if (pdfUrl) {
                popupDownloadBtn.href = pdfUrl;
                popupDownloadBtn.style.display = 'inline-flex';
            } else {
                popupDownloadBtn.style.display = 'none';
            }

            setTimeout(() => {
                successPopup.style.display = 'flex';
                submitBtn.innerHTML = 'Submit';
                submitBtn.disabled = false;
            }, 600);

        } catch (error) {
            console.error('Error:', error);
            alert('Error sending data: ' + error.message);
            
            clearInterval(progressInterval);
            progressBar.style.width = '0%';
            progressContainer.style.display = 'none';
            
            submitBtn.innerHTML = 'Submit';
            submitBtn.disabled = false;
        }
    });
</script>
